<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="img/logo-black.png"><meta property="og:type" content="website"><meta property="og:url" content="https://bags333.pt/"><meta property="og:title" content="BAGS Riders"><meta property="og:site_name" content="BAGS Riders"><meta property="og:description" content="Passeios, rotas, fotos e vídeos do grupo BAGS."><meta property="og:image" content="https://bags333.pt/img/og-bags.jpg?v=3"><meta property="og:image:width" content="400"><meta property="og:image:height" content="400"><meta name="twitter:card" content="summary"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><title>BAGS Riders</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: garagem à noite — barra de autocolantes (um separador por evento) sobre asfalto escuro; cada evento abre como uma ficha de viagem */
:root{
  --bg:#141613; --bg-2:#1B1E1A; --surface:#20241F; --raise:#2A2F28; --line:#343A31;
  --fg:#EEF1EA; --muted:#A3AB9C; --faint:#6F786A;
  --green:#7DB043; --green-deep:#5A8C2A; --on-green:#10140D;
  --sand:#E9B35C; --land:#232822; --land-line:#3C4437; --sea:#171A16;
  --gold:#E4BC45; --silver:#C3CBD0; --bronze:#C9824A; --none:#4A5245;
  --gold-bg:rgba(228,188,69,.13); --silver-bg:rgba(195,203,208,.11); --bronze-bg:rgba(201,130,74,.14);
  --r1:#7DB043; --r2:#E9B35C; --r3:#5FB8C9; --r4:#E07A5F; --r5:#B59BE0; --r6:#F2D35B; --r7:#8FD3A8; --r8:#E58FB5; --r9:#9DB7F0; --r10:#D9A066;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EFEEE8; --bg-2:#E6E5DD; --surface:#FBFAF6; --raise:#F1F0EA; --line:#D6D4CA;
  --fg:#1A1D18; --muted:#5C6457; --faint:#8A9184;
  --green:#4F8020; --green-deep:#3F6B17; --on-green:#FFFFFF;
  --sand:#A86A12; --land:#E3E1D6; --land-line:#C5C2B4; --sea:#F4F3EE;
  --gold:#A87F0E; --silver:#6F7A80; --bronze:#A35A22; --none:#C5C8BE;
  --gold-bg:rgba(201,156,24,.14); --silver-bg:rgba(111,122,128,.12); --bronze-bg:rgba(163,90,34,.12);
  --r1:#4F8020; --r2:#B7770F; --r3:#1F8597; --r4:#C4532F; --r5:#7A5BC0; --r6:#9C8410; --r7:#2E8F5A; --r8:#B8457A; --r9:#3D66C2; --r10:#9A5E1F;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EFEEE8; --bg-2:#E6E5DD; --surface:#FBFAF6; --raise:#F1F0EA; --line:#D6D4CA;
  --fg:#1A1D18; --muted:#5C6457; --faint:#8A9184;
  --green:#4F8020; --green-deep:#3F6B17; --on-green:#FFFFFF;
  --sand:#A86A12; --land:#E3E1D6; --land-line:#C5C2B4; --sea:#F4F3EE;
  --gold:#A87F0E; --silver:#6F7A80; --bronze:#A35A22; --none:#C5C8BE;
  --gold-bg:rgba(201,156,24,.14); --silver-bg:rgba(111,122,128,.12); --bronze-bg:rgba(163,90,34,.12);
  --r1:#4F8020; --r2:#B7770F; --r3:#1F8597; --r4:#C4532F; --r5:#7A5BC0; --r6:#9C8410; --r7:#2E8F5A; --r8:#B8457A; --r9:#3D66C2; --r10:#9A5E1F;
  color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:.95;text-wrap:balance;text-transform:uppercase}
h2{font-size:clamp(2rem,6vw,2.8rem);font-weight:800;letter-spacing:.01em}
h3{font-size:1.5rem;font-weight:800;letter-spacing:.02em}
.eyebrow{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{background:var(--bg-2);border-bottom:1px solid var(--line)}
.mast .inner{display:flex;align-items:center;gap:18px;padding-block:18px 14px}
.logo{height:64px;width:auto;display:block}
.logo.on-light{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo.on-dark{display:none}:root:not([data-theme="dark"]) .logo.on-light{display:block}}
:root[data-theme="light"] .logo.on-dark{display:none}
:root[data-theme="light"] .logo.on-light{display:block}
.mast-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mast-txt b{font-family:var(--display);font-weight:800;font-size:1.55rem;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.mast-txt span{color:var(--muted);font-size:.9rem}
.medal{margin-left:auto;width:64px;height:64px;flex:none}
@media (max-width:480px){.logo{height:50px}.medal{width:50px;height:50px}.mast-txt b{font-size:1.2rem}}

/* sticker tab strip */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg-2) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-block:10px 8px;scrollbar-width:thin;max-width:1080px;margin:0 auto}
.tab{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;padding:6px 4px 6px;border-radius:12px;text-decoration:none;color:var(--muted);border:1px solid transparent;transition:background .15s,color .15s}
.tab:hover{background:var(--surface);color:var(--fg)}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.tab[aria-current="page"] .stk{transform:translateY(-2px) rotate(-3deg)}
.tab .stk{width:58px;height:58px;display:grid;place-items:center;transition:transform .2s}
.tab .stk img{max-width:58px;max-height:58px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.tab .lbl{font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;text-align:center}
.tab .lbl small{display:block;font-family:var(--body);font-weight:500;font-size:.68rem;letter-spacing:0;text-transform:none;color:var(--faint)}
.tab.future{opacity:.6}
.tab-home{width:62px;padding:5px 2px}
.tab-home .stk{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#6FA33A,#3F6B17);box-shadow:0 3px 8px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.tab-home .lbl{font-size:.7rem}
.tab-home .lbl small{font-size:.6rem}
.tab-home .stk svg{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.tab-home[data-v="futuros"] .stk{background:linear-gradient(145deg,#F0BE5E,#C27A12)}
.tab-home[data-v="videos"] .stk{background:linear-gradient(145deg,#E5534B,#A3201A)}
.tab-home[data-v="passeios"] .stk{background:linear-gradient(145deg,#9B7BD4,#5A3A92)}
.tab-home[data-v="passeios"] .stk svg{width:28px;height:28px}
.tab-home[data-v="passeios"][aria-expanded="true"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.chev{font-style:normal;display:inline-block;transition:transform .2s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.strip.sub{border-top:1px dashed var(--line);padding-block:8px}
.strip.sub .tab{width:74px}
.strip.sub .tab .stk{width:50px;height:50px}
.strip.sub .tab .stk img{max-width:50px;max-height:50px}
.strip.sub .tab .lbl{font-size:.74rem}
.strip.sub .tab .lbl small{white-space:nowrap;font-size:.62rem}
.tab-home[data-v="merch"] .stk{background:linear-gradient(145deg,#4A93B3,#22566E)}
.tab-home[data-v="entrar"] .stk{background:linear-gradient(145deg,#D9B347,#8A6A10)}
.tab-home[data-v="sair"] .stk{background:linear-gradient(145deg,#6B7466,#3D443A)}
.tab-home[data-v="sair"] .stk svg{width:28px;height:28px;color:#fff}
.tab-home:hover .stk{transform:translateY(-2px)}

/* generated round sticker */
.gen{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--stk-bg,#1E2A16);color:var(--stk-fg,#F4F1E6);border:3px solid var(--stk-ring,#7DB043);box-shadow:0 2px 4px rgba(0,0,0,.35);font-family:var(--display);text-transform:uppercase;line-height:.9;padding:6px}
.gen b{font-weight:900;font-size:var(--gs,13px);letter-spacing:.02em}
.gen i{font-style:normal;font-weight:700;font-size:calc(var(--gs,13px)*.72);opacity:.85;margin-top:2px}

main{padding-block:28px 64px}
.view{display:flex;flex-direction:column;gap:40px}
section{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:62ch}

/* hero grupo */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(3rem,11vw,5.6rem);font-weight:900;letter-spacing:.005em}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{margin:12px 0 0;color:var(--muted);max-width:52ch}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.board div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.board b{font-family:var(--display);font-size:2.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.board span{color:var(--muted);font-size:.86rem}

/* tiers */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiers{grid-template-columns:1fr}}
.tier{border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.tier::after{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--tc)}
.t-gold{--tc:var(--gold);background:linear-gradient(180deg,var(--gold-bg),transparent 60%),var(--surface)}
.t-silver{--tc:var(--silver);background:linear-gradient(180deg,var(--silver-bg),transparent 60%),var(--surface)}
.t-bronze{--tc:var(--bronze);background:linear-gradient(180deg,var(--bronze-bg),transparent 60%),var(--surface)}
.tier header{display:flex;align-items:center;gap:12px}
.tier .coin{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--tc);color:var(--on-green);font-family:var(--display);font-weight:900;font-size:1.25rem}
.tier h3{color:var(--tc);font-size:1.9rem}
.tier .rule{color:var(--muted);font-size:.88rem;margin-top:2px}
.tier .cnt{margin-left:auto;font-family:var(--display);font-weight:800;font-size:2rem}
.people{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.person{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--raise);font-size:.9rem;font-weight:500;min-width:0}
.person small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.02em;color:var(--fg);background:var(--bg-2);box-shadow:inset 0 0 0 2px var(--ring,var(--none))}
.av.gold{--ring:var(--gold)}.av.silver{--ring:var(--silver)}.av.bronze{--ring:var(--bronze)}
.av.lg{width:52px;height:52px;font-size:1.25rem;box-shadow:inset 0 0 0 3px var(--ring,var(--none))}

/* ranking */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:9px 14px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.rank{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:grid;grid-template-columns:34px minmax(0,10rem) minmax(0,1fr) 3.4rem;align-items:center;gap:10px}
.row .who{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted);font-size:.78rem}
.track{height:12px;background:var(--bg-2);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .5s ease}
.f-gold{background:var(--gold)}.f-silver{background:var(--silver)}.f-bronze{background:var(--bronze)}.f-none{background:var(--none)}
.row .val{text-align:right;font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
@media (max-width:520px){.row{grid-template-columns:34px minmax(0,6.6rem) minmax(0,1fr) 2.8rem;gap:8px}}

/* events chart */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 14px 12px;overflow-x:auto}
.bars,.xl{display:grid;grid-template-columns:repeat(15,minmax(40px,1fr));gap:6px;min-width:660px}
.bars{height:230px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;text-decoration:none;color:var(--fg)}
.bar .n{font-family:var(--display);font-weight:800;font-size:1.15rem;margin-bottom:3px;font-variant-numeric:tabular-nums}
.bar .b{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--green),var(--green-deep));transition:filter .2s}
.bar:hover .b{filter:brightness(1.18)}
.bar.future .b{background:none;border:1.5px dashed var(--faint);height:10px}
.xl{border-top:1px solid var(--line);padding-top:6px}
.xl span{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.2}
.xl span b{display:block;color:var(--fg);font-weight:600}
.yrs{display:grid;grid-template-columns:3fr 3fr 4fr 5fr;gap:6px;min-width:660px;margin-top:8px}
.yrs span{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.1em;color:var(--faint);border-top:2px solid var(--line);padding-top:3px}

/* matrix */
.matrix{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;font-size:.85rem;min-width:100%}
th,td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.03em;color:var(--muted);vertical-align:bottom;line-height:1.1;text-transform:uppercase}
thead th a{text-decoration:none}
thead th a:hover{color:var(--green)}
tbody th{text-align:left;font-weight:500;position:sticky;left:0;background:var(--surface);padding-left:14px;padding-right:12px}
td.tot{font-family:var(--display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%}
.dot.on{background:var(--green)}
.dot.off{box-shadow:inset 0 0 0 1px var(--line)}

/* event view */
.ev-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:620px){.ev-hero{grid-template-columns:1fr;justify-items:start}}
.ev-badge{width:190px;height:190px;display:grid;place-items:center}
.ev-badge img{max-width:190px;max-height:190px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));transform:rotate(-4deg)}
.ev-badge .gen{--gs:34px;border-width:6px}
@media (max-width:620px){.ev-badge{width:140px;height:140px}.ev-badge img{max-width:140px;max-height:140px}.ev-badge .gen{--gs:26px}}
.ev-hero h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:900}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;line-height:1.15}
.fact b{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.fact span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.crew .person{border-radius:14px;padding:8px 12px 8px 8px;background:var(--surface);border:1px solid var(--line)}
.crew .person div{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.crew .person div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .person small{font-size:.75rem}

.map-card{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media (max-width:760px){.map-card{grid-template-columns:1fr}}
.map{background:var(--sea);aspect-ratio:4/3;max-width:100%;position:relative}
.map svg{display:block;width:100%;height:100%}
.map .land{fill:var(--land);stroke:var(--land-line);stroke-width:1;vector-effect:non-scaling-stroke}
.map .rt{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:opacity .2s,stroke-width .2s}
.map .rt.dim{opacity:.18}
.map .rt.hi{stroke-width:5}
.map .rt.aprox{stroke-dasharray:2 7}
.map .rt.ret{stroke-dasharray:1 6;opacity:.7}
.map .halo{fill:none;stroke:var(--sea);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.map .pin{fill:var(--fg);stroke:var(--sea);vector-effect:non-scaling-stroke;stroke-width:2}
.map .pin.start{fill:var(--green)}
.map text{fill:var(--fg);font-family:var(--body);font-weight:600;paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
.map .note{position:absolute;left:10px;bottom:10px;font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.map-card.nomap{grid-template-columns:1fr;max-width:560px}
.map-card.nomap .days{border-left:0;border-top:0}
.days{list-style:none;margin:0;padding:12px;display:flex;flex-direction:column;gap:4px;max-height:100%;overflow:auto;border-left:1px solid var(--line)}
@media (max-width:760px){.days{border-left:0;border-top:1px solid var(--line)}}
.days li button{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font-size:.9rem}
.days li button:hover,.days li button[aria-pressed="true"]{background:var(--raise)}
.days .sw{width:14px;height:4px;border-radius:2px}
.days .km{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums}
.days .tot{border-top:1px solid var(--line);margin-top:6px;padding:10px 10px 4px;display:flex;justify-content:space-between;font-weight:600}
.days .tot b{font-family:var(--display);font-size:1.35rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted);display:flex;gap:14px;align-items:center}
.empty svg{flex:none;width:28px;height:28px;color:var(--faint)}

.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:150px;gap:8px}
@media (max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:130px}}
.gallery button{padding:0;border:0;border-radius:10px;overflow:hidden;background:var(--raise);cursor:zoom-in;position:relative}
.gallery button[hidden]{display:none}

  CKEY=await keyFrom(B64(body.k));WHO=body.n;ISADMIN=!!body.a;EVK={};for(const [rk,kb] of Object.entries(body.e||{}))EVK[rk]=await keyFrom(B64(kb));
  const D=JSON.parse(new TextDecoder().decode(await decBytes(new Uint8Array(await (await fetch("data.bin",{cache:"no-store"})).arrayBuffer()))));
  COUNTRIES=D.COUNTRIES;ROUTES=D.ROUTES;PHOTOS=D.PHOTOS;DATA0=D.DATA;PEND=new Set(D.PEND||[]);NAMEFIX=D.NAMEFIX||{};
  build(DATA0);UNLOCKED=true;gcEvent("login/"+WHO,"Login · "+WHO);
  drawStrip();
  const hello=document.getElementById("hello");if(hello){const me=members.find(m=>m.name===WHO);const first=WHO.split(" ")[0];
    hello.innerHTML=`<span class="me-txt"><b><span class="me-full">${esc(WHO)}</span><span class="me-first">${esc(first)}</span>${me&&me.p?`<sup class="pd">*</sup>`:""}</b><small>${me&&me.tier!=="none"?`${TN[me.tier]}<span class="me-cnt"> · ${me.total} ${me.total===1?"presença":"presenças"}</span>`:(me?"Membro":"Acesso de visitante")}</small></span>${me?av(me):""}${ISADMIN?`<a class="me-out me-stats" href="https://bags333.goatcounter.com" target="_blank" rel="noopener" title="Estatísticas do site" aria-label="Estatísticas do site"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Visitas</span></a>`:""}<a class="me-out" href="#sair" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></a>`;hello.hidden=false}
  return true;
}
function lockStrip(){const sp=(id,ic,l,sm)=>`<a class="tab tab-home" href="#${id}" data-v="${id}"><span class="stk">${ic}</span><span class="lbl">${l}<small>${sm}</small></span></a>`;strip.innerHTML=sp("entrar",SVGI.lock,"Entrar","membros")+sp("videos",SVGI.vid,"Vídeos","YouTube")+sp("futuros",SVGI.fut,"Futuros",FUT.length+(FUT.length===1?" evento":" eventos"))+sp("merch",SVGI.shop,"Merch","loja BAGS");subStrip.innerHTML="";subStrip.hidden=true}

// GoatCounter (estatísticas privadas em bags333.goatcounter.com)
window.goatcounter={no_onload:true};
(function(){const sc=document.createElement("script");sc.async=true;sc.src="https://gc.zgo.at/count.js";sc.dataset.goatcounter="https://bags333.goatcounter.com/count";document.head.appendChild(sc)})();
const GCQ=[];let gcLast="";
function gcSend(o){if(!GCQ.length&&window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count(o)}catch(_){}}else{GCQ.push(o);if(GCQ.length===1){const t=setInterval(()=>{if(window.goatcounter&&window.goatcounter.count){clearInterval(t);GCQ.splice(0).forEach(x=>{try{window.goatcounter.count(x)}catch(_){}})}},500);setTimeout(()=>clearInterval(t),15000)}}}
function gcPage(){const h=(location.hash||"").slice(1)||(UNLOCKED?"grupo":"entrar");const path="/"+h;if(path===gcLast)return;gcLast=path;const ev=EVENTS.find(e=>e.id===h);gcSend({path,title:ev?ev.n:h.charAt(0).toUpperCase()+h.slice(1)})}
function gcEvent(name,title){gcSend({path:name,title:title||name,event:true})}
const _route=route;route=function(k){_route(k);gcPage()};
const _openLB=openLB;openLB=function(set,i){_openLB(set,i);const h=(location.hash||"").slice(1);gcEvent("foto/"+(h||"merch"),"Foto aberta · "+h)};
document.addEventListener("click",ev=>{const a=ev.target.closest('a[href*="youtu"]');if(a)gcEvent("youtube/"+((location.hash||"").slice(1)||"site"),"Clique YouTube")},true);

(async()=>{
  build(PUBLIC_DATA);lockStrip();
  let saved=null;try{saved=localStorage.getItem("bags_code")}catch(_){}
  if(saved){app.innerHTML=`<div class="view"><p class="muted">A abrir…</p></div>`;let ok=false;try{ok=await tryCode(saved)}catch(_){}if(!ok){try{localStorage.removeItem("bags_code")}catch(_){}}}
  route();
})();
